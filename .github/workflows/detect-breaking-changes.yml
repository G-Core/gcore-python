name: CI
on:
  pull_request:
    branches:
      - main
      - next

jobs:
  detect_breaking_changes:
    runs-on: 'ubuntu-latest'
    name: detect-breaking-changes
    if: github.repository == 'G-Core/gcore-python'
    steps:
      - name: Calculate fetch-depth
        run: |
          echo "FETCH_DEPTH=$(expr ${{ github.event.pull_request.commits }} + 1)" >> $GITHUB_ENV

      # v7 adds current checkout fixes while the full SHA keeps the runner dependency immutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ensure we can check out the pull request base in the script below.
          fetch-depth: ${{ env.FETCH_DEPTH }}

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'
      - name: Replace Rye's bundled uv (eMudhra trust store fix)
        # Rye 0.44.0 bundles uv 0.6.3, which trusts the removed
        # emSign ECC Root CA - G3. Rye reuses $HOME/.rye/uv/<version>/uv.
        run: |
          set -euo pipefail
          UV_VERSION=0.13.5
          UV_SHA256=f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          curl -sSfL -o /tmp/uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          found=0
          for bin in "$HOME"/.rye/uv/*/uv; do
            [ -f "$bin" ] || continue
            install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$bin"
            "$bin" --version
            found=1
          done
          [ "$found" = 1 ] || { echo "No Rye-bundled uv found"; exit 1; }
      - name: Install dependencies
        run: |
          rye sync --all-features
      - name: Detect removed symbols
        run: |
          rye run python scripts/detect-breaking-changes.py "${{ github.event.pull_request.base.sha }}"

      - name: Detect breaking changes
        run: |
          # Try to check out previous versions of the breaking change detection script. This ensures that
          # we still detect breaking changes when entire files and their tests are removed.
          git checkout "${{ github.event.pull_request.base.sha }}" -- ./scripts/detect-breaking-changes 2>/dev/null || true
          ./scripts/detect-breaking-changes ${{ github.event.pull_request.base.sha }}
