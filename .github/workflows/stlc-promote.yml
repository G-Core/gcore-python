name: Promote SDKs

# Promote staging to production: fast-forward production `main` up to the
# staging trunk, preserving commit SHAs. Dispatch-only with a production
# environment gate: changes accumulate on the trunk and a maintainer promotes
# the batch in one fast-forward.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.repository == 'G-Core/gcore-python-staging'
    environment: production
    env:
      PRODUCTION_OWNER: G-Core
      PRODUCTION_REPOSITORY: gcore-python
    steps:
      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate gcore-sdk-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GCORE_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GCORE_SDK_BOT_PRIVATE_KEY }}
          owner: ${{ env.PRODUCTION_OWNER }}
          repositories: ${{ env.PRODUCTION_REPOSITORY }}
          permission-contents: write
          permission-workflows: write

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_OWNER}/${PRODUCTION_REPOSITORY}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          # Compare by content — SHAs differ after a release adds version/changelog.
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote staging to production (fast-forward)
        if: steps.diff.outputs.synced == 'false'
        run: |
          # Refuse unless production/main is an ancestor of staging/main (else
          # staging has forked from production and can't be fast-forwarded).
          if ! git merge-base --is-ancestor production/main origin/main; then
            echo "::error title=Promote blocked::production/main is not an ancestor of staging main."
            exit 1
          fi
          git push production origin/main:refs/heads/main
          echo "Pushed staging/main to production/main via fast-forward."
