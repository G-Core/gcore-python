name: CI
on:
  # Keep push limited to `main` so a branch SHA gets exactly one check run,
  # from the `pull_request` event. Two runs for one SHA let a required check
  # pass on the skipped one (actions/runner#1085).
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  # stlc-config dispatches this for preview branches, which never get a pull
  # request here, so a preview SHA still gets exactly one run
  workflow_dispatch: {}

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    # Metadata-only commits land straight on `main` and change no code.
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'
    steps:
      # v7 adds current checkout fixes while the full SHA keeps the runner dependency immutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified uv before Rye bootstrap (eMudhra trust store fix)
        # make Rye use the fixed trust store while installing its own environment
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/uv.tar.gz "$url"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.rye/uv/0.6.3" /tmp/uv-extract
          tar -xzf /tmp/uv.tar.gz -C /tmp/uv-extract --strip-components=1
          install -m 0755 /tmp/uv-extract/uv "$HOME/.rye/uv/0.6.3/uv"
          "$HOME/.rye/uv/0.6.3/uv" --version
        env:
          UV_VERSION: '0.13.5'
          UV_SHA256: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Replace Rye's bundled uv (eMudhra trust store fix)
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundled_uvs=("$HOME"/.rye/uv/*/uv)
          [ "${#bundled_uvs[@]}" -gt 0 ] || { echo "No Rye-bundled uv found"; exit 1; }
          for bin in "${bundled_uvs[@]}"; do
            install -m 0755 /tmp/uv-extract/uv "$bin"
            "$bin" --version
          done

      - name: Install dependencies
        run: rye sync --all-features

      - name: Run lints
        run: ./scripts/lint

  build:
    # Metadata-only commits land straight on `main` and change no code.
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # v7 adds current checkout fixes while the full SHA keeps the runner dependency immutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified uv before Rye bootstrap (eMudhra trust store fix)
        # make Rye use the fixed trust store while installing its own environment
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/uv.tar.gz "$url"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.rye/uv/0.6.3" /tmp/uv-extract
          tar -xzf /tmp/uv.tar.gz -C /tmp/uv-extract --strip-components=1
          install -m 0755 /tmp/uv-extract/uv "$HOME/.rye/uv/0.6.3/uv"
          "$HOME/.rye/uv/0.6.3/uv" --version
        env:
          UV_VERSION: '0.13.5'
          UV_SHA256: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Replace Rye's bundled uv (eMudhra trust store fix)
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundled_uvs=("$HOME"/.rye/uv/*/uv)
          [ "${#bundled_uvs[@]}" -gt 0 ] || { echo "No Rye-bundled uv found"; exit 1; }
          for bin in "${bundled_uvs[@]}"; do
            install -m 0755 /tmp/uv-extract/uv "$bin"
            "$bin" --version
          done

      - name: Install dependencies
        run: rye sync --all-features

      - name: Run build
        run: rye build

  # The generator only emits this job when the spec has a hosted URL, which stlc
  # does not set. scripts/mock serves the embedded spec, so the job runs without one.
  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    # Metadata-only commits land straight on `main` and change no code.
    if: github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata'
    steps:
      # v7 adds current checkout fixes while the full SHA keeps the runner dependency immutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified uv before Rye bootstrap (eMudhra trust store fix)
        # make Rye use the fixed trust store while installing its own environment
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/uv.tar.gz "$url"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.rye/uv/0.6.3" /tmp/uv-extract
          tar -xzf /tmp/uv.tar.gz -C /tmp/uv-extract --strip-components=1
          install -m 0755 /tmp/uv-extract/uv "$HOME/.rye/uv/0.6.3/uv"
          "$HOME/.rye/uv/0.6.3/uv" --version
        env:
          UV_VERSION: '0.13.5'
          UV_SHA256: 'f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f'

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Replace Rye's bundled uv (eMudhra trust store fix)
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundled_uvs=("$HOME"/.rye/uv/*/uv)
          [ "${#bundled_uvs[@]}" -gt 0 ] || { echo "No Rye-bundled uv found"; exit 1; }
          for bin in "${bundled_uvs[@]}"; do
            install -m 0755 /tmp/uv-extract/uv "$bin"
            "$bin" --version
          done

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
