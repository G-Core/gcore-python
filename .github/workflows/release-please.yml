name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'G-Core/gcore-python'
    runs-on: ubuntu-latest

    steps:
      - name: Generate gcore-sdk-bot token
        id: app-token
        # v3.2.0 adds current token-action fixes; the full SHA makes the version immutable.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GCORE_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GCORE_SDK_BOT_PRIVATE_KEY }}
          owner: G-Core
          repositories: gcore-python
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # v5 includes current release automation fixes and retains the configured workflow inputs.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
