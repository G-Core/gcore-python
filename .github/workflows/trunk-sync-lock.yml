name: Trunk sync lock

# Posts a `trunk-synced` commit status to open PRs targeting `main`: red while
# production is ahead of the trunk (a release hasn't been synced back), green
# once in sync. Make `trunk-synced` a required status check to block merges
# onto a stale trunk.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Sync from production"]
    types: [completed]
  repository_dispatch:
    types: [prod-released]
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.repository == 'G-Core/gcore-python-staging'
    env:
      PRODUCTION_REPO: G-Core/gcore-python
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Evaluate sync state and post status to open main PRs
        run: |
          set -euo pipefail
          git remote add production "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch --no-tags production main
          # On a pull_request run HEAD is the PR merge ref, so resolve the
          # trunk explicitly. Otherwise a PR carrying the back-sync commits
          # would report itself in sync while main is still stale.
          trunk=$(git rev-parse --verify refs/remotes/origin/main)
          if git merge-base --is-ancestor production/main "$trunk"; then
            state=success; desc="main is in sync with production"
          else
            state=failure; desc="production is ahead — wait for the back-sync before merging"
          fi
          echo "trunk-synced => $state ($desc)"
          shas=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefOid --jq '.[].headRefOid')
          if [ -z "$shas" ]; then echo "no open PRs targeting main"; exit 0; fi
          # Keep going when one PR fails so the rest still get a status.
          posted=0
          for sha in $shas; do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" -f context="trunk-synced" -f description="$desc" >/dev/null; then
              echo "posted trunk-synced=$state to $sha"
              posted=$((posted + 1))
            else
              echo "::warning::failed to post trunk-synced to $sha"
            fi
          done
          if [ "$posted" -eq 0 ]; then
            echo "::error::failed to post trunk-synced to every open PR"
            exit 1
          fi
